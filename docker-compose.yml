services:
  postgres:
    image: postgres:17-alpine
    container_name: haupcar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haupcar_cars
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haupcar_cars"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
