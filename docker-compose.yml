services:
  postgres:
    image: postgres:17-alpine
    container_name: haupcar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: haupcar_cars
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d haupcar_cars"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/haupcar_cars?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      target: runtime
    container_name: haupcar-api
    restart: unless-stopped
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/haupcar_cars?schema=public
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
